basePath: /
definitions:
  experiences.createExperienceRequest:
    properties:
      description:
        type: string
      ended_at:
        type: string
      experience_type:
        type: string
      is_current:
        type: boolean
      location:
        type: string
      organization:
        type: string
      role_title:
        type: string
      started_at:
        type: string
    type: object
  experiences.updateExperienceRequest:
    properties:
      description:
        type: string
      ended_at:
        type: string
      experience_type:
        type: string
      is_current:
        type: boolean
      location:
        type: string
      organization:
        type: string
      role_title:
        type: string
      started_at:
        type: string
    type: object
  handler.StatusResponse:
    properties:
      status:
        type: string
    type: object
  httpx.Code:
    enum:
    - INTERNAL_SERVER_ERROR
    - VALIDATION_FAILED
    - NOT_FOUND
    - UNAUTHORIZED
    - FORBIDDEN
    - CONFLICT
    - TOO_MANY_REQUESTS
    - METHOD_NOT_ALLOWED
    type: string
    x-enum-varnames:
    - CodeInternal
    - CodeInvalidRequest
    - CodeNotFound
    - CodeUnauthorized
    - CodeForbidden
    - CodeConflict
    - CodeTooManyRequests
    - CodeMethodNotAllowed
  httpx.Error:
    properties:
      code:
        $ref: '#/definitions/httpx.Code'
      details:
        items:
          $ref: '#/definitions/httpx.ErrorDetail'
        type: array
      message:
        type: string
      request_id:
        type: string
    type: object
  httpx.ErrorDetail:
    properties:
      field:
        type: string
      issue:
        type: string
    type: object
  jobs.bulkCreateJobRequest:
    properties:
      jobs:
        items:
          $ref: '#/definitions/jobs.createJobRequest'
        type: array
    type: object
  jobs.bulkQueueAnalyzeItemRequest:
    properties:
      force:
        type: boolean
      slug:
        type: string
    type: object
  jobs.bulkQueueAnalyzeResponse:
    properties:
      workflow_ids:
        items:
          type: string
        type: array
    type: object
  jobs.createJobRequest:
    properties:
      apply_url:
        type: string
      company:
        type: string
      description:
        type: string
      external_id:
        type: string
      is_remote:
        type: boolean
      location:
        type: string
      posted_date:
        type: string
      source:
        type: string
      source_url:
        type: string
      title:
        type: string
      user_id:
        description: |-
          UserID is the internal user id that owns this job listing.
          Required for API key callers. Clerk callers must not send it (it is
          resolved from the token); sending it is a 400 error.
        type: string
      visa_relocation:
        type: boolean
    type: object
  jobs.updateJobRequest:
    properties:
      analyze_result:
        type: string
      failure_message:
        type: string
      status:
        type: string
    type: object
  models.BulkCreateJobResult:
    properties:
      added_to_user_list:
        type: boolean
      created:
        type: boolean
      slug:
        type: string
    type: object
  models.CategoryConfig:
    properties:
      description:
        type: string
      name:
        type: string
      weight:
        type: number
    type: object
  models.CreateJobResult:
    properties:
      addedToUserList:
        type: boolean
      created:
        type: boolean
      job:
        $ref: '#/definitions/models.Job'
    type: object
  models.CreateScoringConfigParams:
    properties:
      categories:
        items:
          $ref: '#/definitions/models.CategoryConfig'
        type: array
      family:
        type: string
      is_active:
        type: boolean
      version:
        type: integer
    type: object
  models.Experience:
    properties:
      createdAt:
        type: string
      description:
        type: string
      endedAt:
        type: string
      experienceType:
        $ref: '#/definitions/models.ExperienceType'
      id:
        type: string
      isCurrent:
        type: boolean
      location:
        type: string
      organization:
        type: string
      roleTitle:
        type: string
      startedAt:
        type: string
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  models.ExperienceType:
    enum:
    - professional
    - freelance
    - internship
    - volunteer
    - other
    type: string
    x-enum-varnames:
    - ExperienceTypeProfessional
    - ExperienceTypeFreelance
    - ExperienceTypeInternship
    - ExperienceTypeVolunteer
    - ExperienceTypeOther
  models.Job:
    properties:
      analyze_result:
        type: string
      apply_url:
        type: string
      company:
        type: string
      created_at:
        type: string
      description:
        type: string
      external_id:
        type: string
      failure_message:
        type: string
      id:
        type: integer
      is_remote:
        type: boolean
      location:
        type: string
      posted_date:
        type: string
      slug:
        type: string
      source:
        type: string
      source_url:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      updated_by_id:
        type: string
      updated_by_type:
        type: string
      visa_relocation:
        type: boolean
    type: object
  models.Project:
    properties:
      achievements:
        type: string
      createdAt:
        type: string
      description:
        type: string
      endedAt:
        type: string
      id:
        type: string
      isCurrent:
        type: boolean
      name:
        type: string
      responsibilities:
        type: string
      startedAt:
        type: string
      updatedAt:
        type: string
      userExperienceID:
        type: string
      userID:
        type: string
    type: object
  models.ScoringConfig:
    properties:
      categories:
        items:
          $ref: '#/definitions/models.CategoryConfig'
        type: array
      created_at:
        type: string
      family:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      updated_at:
        type: string
      version:
        type: integer
    type: object
  models.UpdateScoringConfigParams:
    properties:
      categories:
        items:
          $ref: '#/definitions/models.CategoryConfig'
        type: array
      is_active:
        type: boolean
    type: object
  models.UserSkill:
    properties:
      createdAt:
        type: string
      id:
        type: string
      proficiency:
        type: string
      skillKey:
        type: string
      skillName:
        type: string
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  projects.createProjectRequest:
    properties:
      achievements:
        type: string
      description:
        type: string
      ended_at:
        type: string
      is_current:
        type: boolean
      name:
        type: string
      responsibilities:
        type: string
      started_at:
        type: string
      user_experience_id:
        type: string
    type: object
  projects.linkProjectSkillsRequest:
    properties:
      skill_ids:
        items:
          type: string
        type: array
    type: object
  projects.updateProjectRequest:
    properties:
      achievements:
        type: string
      description:
        type: string
      ended_at:
        type: string
      is_current:
        type: boolean
      name:
        type: string
      responsibilities:
        type: string
      started_at:
        type: string
      user_experience_id:
        type: string
    type: object
  webhook.StatusResponse:
    properties:
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Job-search and application-assistance platform API.
  title: GetOJobu API
  version: 0.1.0
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Returns service status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatusResponse'
      summary: Health check
      tags:
      - health
  /v1/experiences:
    get:
      description: List all career experiences for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Experience'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: List experiences
      tags:
      - experiences
    post:
      consumes:
      - application/json
      description: Create a new career experience for the authenticated user
      parameters:
      - description: Experience data
        in: body
        name: experience
        required: true
        schema:
          $ref: '#/definitions/experiences.createExperienceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Experience'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Create experience
      tags:
      - experiences
  /v1/experiences/{id}:
    get:
      description: Get a career experience by id
      parameters:
      - description: Experience ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Experience'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Get experience
      tags:
      - experiences
    put:
      consumes:
      - application/json
      description: Update a career experience by id
      parameters:
      - description: Experience ID
        in: path
        name: id
        required: true
        type: string
      - description: Experience data
        in: body
        name: experience
        required: true
        schema:
          $ref: '#/definitions/experiences.updateExperienceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Experience'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Update experience
      tags:
      - experiences
  /v1/jobs:
    get:
      consumes:
      - application/json
      description: List recent jobs ordered by created_at descending. Optional limit
        (default 20, max 100). Clerk callers see only their owned jobs; API key callers
        see all jobs.
      parameters:
      - description: Maximum number of jobs to return (default 20, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Job'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: List jobs
      tags:
      - jobs
    post:
      consumes:
      - application/json
      description: Create a single job listing. On slug conflict the existing row
        is kept and returned with Created=false.
      parameters:
      - description: Job data
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/jobs.createJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CreateJobResult'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CreateJobResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Create job
      tags:
      - jobs
  /v1/jobs/{slug}:
    get:
      consumes:
      - application/json
      description: Get a job listing by slug.
      parameters:
      - description: Job slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Get job
      tags:
      - jobs
    patch:
      consumes:
      - application/json
      description: Transition a job's status (analyze_pending | analyzed | failed).
        Called by the Temporal worker on completion.
      parameters:
      - description: Job slug
        in: path
        name: slug
        required: true
        type: string
      - description: Status update payload
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/jobs.updateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Job'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Update job status
      tags:
      - jobs
  /v1/jobs/bulk:
    post:
      consumes:
      - application/json
      description: Create many job listings at once (max 100). Conflicting slugs are
        skipped.
      parameters:
      - description: Job listings
        in: body
        name: jobs
        required: true
        schema:
          $ref: '#/definitions/jobs.bulkCreateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BulkCreateJobResult'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Bulk create jobs
      tags:
      - jobs
  /v1/jobs/bulk-queue-analyze:
    post:
      consumes:
      - application/json
      description: Queue job description analysis workflows in Temporal for multiple
        jobs. Jobs must have status 'new' or 'failed' (with force=true).
      parameters:
      - description: Jobs to queue for analysis
        in: body
        name: jobs
        required: true
        schema:
          items:
            $ref: '#/definitions/jobs.bulkQueueAnalyzeItemRequest'
          type: array
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/jobs.bulkQueueAnalyzeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Bulk queue job analysis
      tags:
      - jobs
  /v1/projects:
    get:
      description: List all projects for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Project'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: List projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project for the authenticated user
      parameters:
      - description: Project data
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/projects.createProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Project'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Create project
      tags:
      - projects
  /v1/projects/{id}:
    get:
      description: Get a project by id
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Project'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Get project
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Update a project by id
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Project data
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/projects.updateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Project'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Update project
      tags:
      - projects
  /v1/projects/{id}/skills:
    get:
      description: List skills linked to a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UserSkill'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: List project skills
      tags:
      - project-skills
    post:
      consumes:
      - application/json
      description: Associate skills with a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Skill IDs
        in: body
        name: skills
        required: true
        schema:
          $ref: '#/definitions/projects.linkProjectSkillsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Link project skills
      tags:
      - project-skills
  /v1/scoring-configs:
    get:
      description: List scoring configurations filtered by family and active status.
        Accessible only via machine API key.
      parameters:
      - description: Filter by job family
        in: query
        name: family
        type: string
      - description: Filter by active state
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ScoringConfig'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: List scoring configurations
      tags:
      - scoring_configs
    post:
      consumes:
      - application/json
      description: Create a new version of a scoring configuration for a job family.
        Accessible only via machine API key.
      parameters:
      - description: Scoring config payload
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/models.CreateScoringConfigParams'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.ScoringConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Create scoring configuration
      tags:
      - scoring_configs
  /v1/scoring-configs/{id}:
    get:
      description: Retrieve a scoring configuration by its UUID. Accessible only via
        machine API key.
      parameters:
      - description: Scoring config UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ScoringConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Get scoring configuration by ID
      tags:
      - scoring_configs
    patch:
      consumes:
      - application/json
      description: Update an existing scoring configuration. Accessible only via machine
        API key.
      parameters:
      - description: Scoring config UUID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/models.UpdateScoringConfigParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ScoringConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.Error'
      security:
      - ApiKeyAuth: []
      summary: Update scoring configuration
      tags:
      - scoring_configs
  /v1/scoring-configs/active:
    get:
      description: Retrieve the active scoring configuration for a job family. Accessible
        only via machine API key.
      parameters:
      - description: Job family key (e.g. technology, transportation)
        in: query
        name: family
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ScoringConfig'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.Error'
        "401":
          description: Unauthorized
