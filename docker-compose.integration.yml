# GetOJobu Integration Test Docker Compose
# PostgreSQL only - Temporal and other services are mocked or tested via unit tests
# The Go API integration tests use testcontainers-go with PostgreSQL
#
version: "3.9"

services:
  # PostgreSQL database - used by Go API integration tests
  # and as the persistence layer for Temporal in production
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: getojobu_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: