basePath: /
definitions:
  handler.StatusResponse:
    properties:
      status:
        type: string
    type: object
  webhook.StatusResponse:
    properties:
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://example.com/support
  description: Job-search and application-assistance platform API.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://example.com/terms/
  title: GetOJobu API
  version: 0.1.0
paths:
  /v1/health:
    get:
      consumes:
      - application/json
      description: Returns service status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.StatusResponse'
      summary: Health check
      tags:
      - health
  /v1/webhooks/clerk:
    post:
      consumes:
      - application/json
      description: Receives Clerk user lifecycle events (created, updated, deleted)
      parameters:
      - description: Svix signature header
        in: header
        name: svix-signature
        required: true
        type: string
      - description: Svix timestamp header
        in: header
        name: svix-timestamp
        required: true
        type: string
      - description: Svix message ID header
        in: header
        name: svix-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhook.StatusResponse'
      summary: Clerk webhook
      tags:
      - webhook
schemes:
- http
swagger: "2.0"
